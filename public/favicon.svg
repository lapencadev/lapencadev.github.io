<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0a0a0f"/>

  <!-- Pen nib (plumín): kite shape -->
  <path d="M16 4 L25 14 L16 28 L7 14 Z"
        fill="rgba(255,45,120,0.12)"
        stroke="#ff2d78"
        stroke-width="1.6"
        stroke-linejoin="round"/>

  <!-- Center slit (canal de tinta) -->
  <line x1="16" y1="14" x2="16" y2="27"
        stroke="#00ffe5"
        stroke-width="1.3"
        stroke-linecap="round"/>

  <!-- Ink drop at tip -->
  <circle cx="16" cy="27" r="1.7" fill="#00ffe5"/>

  <!-- Top highlight dot -->
  <circle cx="16" cy="4.5" r="1.2" fill="#ff2d78"/>
</svg>
