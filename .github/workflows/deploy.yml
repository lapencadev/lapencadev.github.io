name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez: el que está en marcha termina y el último push en cola espera su turno
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - id: deployment
        uses: actions/deploy-pages@v5
